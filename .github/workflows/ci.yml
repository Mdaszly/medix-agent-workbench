name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        env:
          CI: "true"
          MEDIX_ENABLE_LLM: "false"
          DIFY_API_KEY: ""
          DIFY_APP_ID: ""
          PYTHONUTF8: "1"
          LANG: "C.UTF-8"
          LC_ALL: "C.UTF-8"
        run: |
          set -o pipefail
          python -m pytest -q --tb=short 2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E 'FAILED|ERROR|assert' pytest-output.txt | tail -30 || true
            exit "$status"
          fi

      - name: Upload pytest log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: backend/pytest-output.txt

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
