name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend tests (${{ matrix.test_file }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test_file:
          - test_agent_gateway.py
          - test_dify_integration.py
          - test_langgraph.py
          - test_medical_answer.py
          - test_security_boundaries.py
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        env:
          MEDIX_ENABLE_LLM: "false"
          DIFY_API_KEY: ""
          DIFY_APP_ID: ""
          PYTHONUTF8: "1"
          LANG: "C.UTF-8"
          LC_ALL: "C.UTF-8"
        run: python -m pytest tests/${{ matrix.test_file }} -q --tb=short

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
